name: Tests

# Runs the offline test suite on every push and pull request. Nothing here
# touches the network: the whole pipeline is exercised against fixtures, so a
# broken aggregation is caught before it can write bad rows into the archive.

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", ".github/workflows/tests.yml", "requirements.txt"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Aggregation tests
        run: python tests/test_aggregate.py

      - name: Historical-layer tests
        run: python tests/test_history.py

      - name: Pipeline smoke test (fixture mode, no network)
        run: python src/collect_realtime.py --fixture
